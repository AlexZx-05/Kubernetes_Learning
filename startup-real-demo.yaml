apiVersion: apps/v1
kind: Deployment
metadata:
  name: startup-real-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: startup-real-demo

  template:
    metadata:
      labels:
        app: startup-real-demo

    spec:
      containers:
        - name: nginx
          image: nginx:1.27

          command:
            - sh
            - -c
            - |
              echo "Application starting..."
              sleep 30
              echo "Application started!"
              nginx -g "daemon off;"

          ports:
            - containerPort: 80

          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            failureThreshold: 3